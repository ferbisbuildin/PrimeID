[package]
name = "primeid-core"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "PrimeID protocol: salted-hash selective disclosure credentials, holder binding and nonce-bound answers (secp256k1)"

# Pure Rust, no KeyOS dependencies: the same code runs in the Passport Prime app and in host tests.
[dependencies]
k256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
sha2 = { version = "0.10", default-features = false }
hmac = { version = "0.12", default-features = false }
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
zeroize = { version = "1.8", features = ["derive"] }
