# Foundation KeyOS Permission Templates for IncogID++ Vault

[templates.incogid-camera]
description = "Air-gapped QR and UR barcode scanning via Omnivision hardware camera"
services = ["os/camera"]
permissions = [
  "os/camera:Subscribe",
  "os/camera:NotifyVisible",
  "os/camera:IsEnabled",
  "os/camera:IsInUse"
]

[templates.incogid-storage]
description = "Sandboxed durable user flash storage for credentials and privacy receipts"
services = ["os/fs"]
permissions = [
  "os/fs:OpenFileMessage",
  "os/fs:CloseFile",
  "os/fs:ReadFile",
  "os/fs:WriteFile",
  "os/fs:SeekFile",
  "os/fs:Flush",
  "os/fs:CreateDirMessage"
]

[templates.incogid-quantum-link]
description = "Post-quantum encrypted Bluetooth Low Energy tunnel to Envoy and Web Verifier"
services = ["os/quantum-link"]
permissions = [
  "os/quantum-link:GetXidDocument",
  "os/quantum-link:SendAccountUpdate",
  "os/quantum-link:PublishPsbt"
]

[templates.incogid-security]
description = "Hardware secure element key derivation and master state verification"
services = ["os/security"]
permissions = [
  "os/security:GetMasterKeyState",
  "os/security:AppSeed"
]

[templates.incogid-system]
description = "System device identity and airlock mode inspection"
services = ["os/settings", "os/gui-server"]
permissions = [
  "os/settings:GetDeviceName",
  "os/settings:GetSystemTheme",
  "os/settings:GetAirlockMode",
  "os/gui-server:GetPendingNavRequest",
  "os/gui-server:SwitchToLauncher"
]
