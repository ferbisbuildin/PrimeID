[package]
name = "primeid-core"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "PrimeID wire format and checks, byte-compatible with packages/core-crypto"

[dependencies]
k256 = { version = "0.13", features = ["ecdsa", "sha256"] }
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
