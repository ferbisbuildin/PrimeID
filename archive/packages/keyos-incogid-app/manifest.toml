# Foundation Microkernel Manifest for IncogID++

[app]
name = "IncogID++ Vault"
app_id = "xyz.foundation.incogid"
icon = "resources/icon.svg"
permissions = ["nfc", "qr-scanner", "quantum-link", "security", "fs", "settings", "gui-server"]
target_api_version = "1"

[permissions]
"os/gui-server" = ["GetPendingNavRequest", "SwitchToLauncher", "ScanQr"]
"os/quantum-link" = ["GetXidDocument", "SendAccountUpdate", "PublishPsbt"]
"os/security" = ["GetMasterKeyState", "GetPinEntryMode", "SignDigest"]
"os/fs" = ["ReadFile", "WriteFile", "CloseFile", "CreateDirMessage"]
"os/settings" = ["GetDeviceName", "GetSystemTheme", "GetPrimeColor", "GetAirlockMode"]
