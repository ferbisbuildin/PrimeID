[package]
name = "incogid-app"
version = "1.0.0"
edition = "2021"
authors = ["Foundation Devices Open Source Ecosystem <hello@foundation.xyz>"]
description = "Air-gapped Selective Disclosure Credential Vault for Foundation Passport Prime (KeyOS)"
license = "Apache-2.0"

[dependencies]
# KeyOS Platform & UI Microkernel Bindings
slint = { version = "1.8", default-features = false, features = ["compat-1-2"] }
slint-keyos-platform = { git = "https://github.com/Foundation-Devices/KeyOS.git", default-features = false }
gui_server_api = { git = "https://github.com/Foundation-Devices/KeyOS.git" }
quantum_link = { git = "https://github.com/Foundation-Devices/KeyOS.git" }
security = { git = "https://github.com/Foundation-Devices/KeyOS.git" }
fs = { git = "https://github.com/Foundation-Devices/KeyOS.git" }
settings = { git = "https://github.com/Foundation-Devices/KeyOS.git" }

# Logging and IPC Serialization
log = "0.4"
log_server = { git = "https://github.com/Foundation-Devices/KeyOS.git" }
rkyv = { version = "0.8", features = ["validation"] }
server = { git = "https://github.com/Foundation-Devices/KeyOS.git" }
xous = { git = "https://github.com/Foundation-Devices/KeyOS.git" }

# Pure Rust Cryptography for ATECC608C / SAMA5D27 ARM Target
k256 = { version = "0.13", default-features = false, features = ["ecdsa", "arithmetic"] }
sha2 = { version = "0.10", default-features = false }
hex = { version = "0.4", default-features = false, features = ["alloc"] }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }

[build-dependencies]
slint-build = "1.8"
